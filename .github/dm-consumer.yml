## AI-Assisted

## Per-repo configuration for the developer-meta-files reusable CI
## workflows; read by reusable-dist-ai-tests.yml via
## dist-ai/ci/dist-ai-tests-ci-config.sh.

dist-ai-tests:
  ## dist-installer-cli-tests regenerates dist-installer-cli-standalone via
  ## build-dist-installer-cli (the standalone-drift guard), and the generator runs
  ## shellcheck on its output -- absent, that step FATALs. safe-rm is the suite's
  ## scratch-cleanup dependency.
  apt-packages: "python3 python3-pytest python3-hypothesis safe-rm shellcheck"

  ## The standalone inlines helper-scripts; the drift guard regenerates it FROM the
  ## pinned helper-scripts, and the dry-run / exit-code lanes source the standalone
  ## whose inlined log_run needs stecho / sanitize-string. helper-scripts: true
  ## checks it out and (via dist-ai-tests-all) exports HELPER_SCRIPTS_PATH.
  helper-scripts: true

  ## dist-installer-cli-tests also carries the virtualbox-host toolchain drift guards
  ## (virtualbox_host_toolchain_consistency_test, virtualbox_recommends_coverage_test),
  ## which read kicksecure-meta-packages/debian/control -- a SEPARATE derivative-maker
  ## package absent from this component's standalone CI checkout. They correctly emit a
  ## target-absent SKIP there; authorize it so the suite's other cases still gate while
  ## the vbox guards run where their cross-component target exists (the dm build).
  allow-skip:
    - dist-installer-cli-tests
