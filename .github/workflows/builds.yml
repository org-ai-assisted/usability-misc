## AI-Assisted

## Thin wrapper: the dist-installer-cli container-build smoke lane (distro matrix,
## default / VirtualBox / onion / Oracle / locale / source paths + the cross-user
## install regression) lives in developer-meta-files, and its setup + regression
## scripts live in org-ai-assisted/dist-ai (ci/dist-installer-cli-build/*). This
## file only points the reusable workflow at this repo's standalone.
##
## Reusable:
## https://github.com/org-ai-assisted/developer-meta-files/blob/master/.github/workflows/reusable-dist-installer-cli-build.yml

name: docker build

on:
  push:
    paths:
      - 'usr/share/usability-misc/dist-installer-cli-standalone'
      - '.github/workflows/builds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: org-ai-assisted/developer-meta-files/.github/workflows/reusable-dist-installer-cli-build.yml@master
    with:
      standalone-path: usr/share/usability-misc/dist-installer-cli-standalone
